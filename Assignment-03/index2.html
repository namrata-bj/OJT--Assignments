<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Example 03: Job Application Form</h2>
<form>
<table>
<tr>
<td>    
<label for="name">Full Name:</label></td>
<td>
<input type="text" id="name"></td>
</tr>
<tr>
<td>
 <label for="email">Email:</label>
 </td>
 <td>
 <input type="email" id="email">
 </td>
</tr>
<tr>
<td>
 <label for="mobile">Mobile Number:</label>
</td>
<td>
<input type="tel" id="mobile">
</td>
</tr>
<tr>
<td><label for="password">Password:</label></td>
<td><input type="password" id="password"></td>
</tr>
<tr>
<td>
 <label>Gender:</label></td>
<td>
 <input type="radio" id="male" name="gender"> Male
<input type="radio" id="female" name="gender"> Female
<input type="radio" id="other" name="gender"> Other
</td>
</tr>
<tr>
 <td>
<label for="position">Position:</label></td>
<td>
<select id="position">
 <option>Select Position</option>
<option>Web Developer</option>
<option>Software Developer</option>
<option>Data Analyst</option>
 </select>
</td>
</tr>
<tr>
<td>
 <label>Skills:</label></td>
<td>
<input type="checkbox" id="python"> Python
<input type="checkbox" id="java"> Java
<input type="checkbox" id="html"> HTML/CSS
<input type="checkbox" id="javascript"> JavaScript
</td>
</tr>
<tr>
 <td><label>Experience:</label></td>
 <td>
 <input type="radio" id="fresher" name="experience"> Fresher
 <input type="radio" id="one" name="experience"> 1-2 Years
 <input type="radio" id="three" name="experience"> 3+ Years
 </td>
</tr>

<tr>
<td><label for="address">Address:</label></td>
<td><textarea id="address" rows="5" cols="40"></textarea></td>
</tr>

<tr>
<td>
<label for="resume">Resume:</label></td>
<td>
 <input type="file" id="resume"></td>
</tr>
<tr>
    <td> <input type="reset" value="Reset">
 <input type="submit" value="Apply">
</td>
</tr>
</table>

</form>
</body>
</html>
